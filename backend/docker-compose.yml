services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-divebubble}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-divebubble}"
      POSTGRES_DB: "${POSTGRES_DB:-divebubble}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-divebubble} -d ${POSTGRES_DB:-divebubble}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL_COMPOSE:-postgres://${POSTGRES_USER:-divebubble}:${POSTGRES_PASSWORD:-divebubble}@postgres:5432/${POSTGRES_DB:-divebubble}?sslmode=disable}"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      # Not 127.0.0.1-only like before — a physical device testing over the LAN (see
      # CLAUDE.md's --dart-define=CENTRIFUGO_WS_URL example) needs to reach this directly,
      # same as the Go API itself already binds openly. Local dev only; prod's compose file
      # is separate and puts Centrifugo behind nginx regardless.
      - "${CENTRIFUGO_PORT:-8000}:8000"
    environment:
      CENTRIFUGO_API_KEY: "${CENTRIFUGO_API_KEY:-devkey}"
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: "${CENTRIFUGO_TOKEN_SECRET:-devsecret}"
    restart: unless-stopped

volumes:
  postgres_data:
