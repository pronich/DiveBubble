services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-divebubble}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-divebubble}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to the host loopback only — lets an SSH tunnel (e.g. for DBeaver) reach it from
    # the droplet side, same posture as centrifugo/api's own loopback-only ports below. Not
    # reachable from the public internet either way.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-divebubble} -d ${POSTGRES_DB:-divebubble}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-divebubble}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-divebubble}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    # No host port — this project's own nginx (below) reaches it by service name on the
    # internal compose network now, not via a loopback port.
    environment:
      CENTRIFUGO_API_KEY: "${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY must be set}"
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: "${CENTRIFUGO_TOKEN_SECRET:?CENTRIFUGO_TOKEN_SECRET must be set}"
    restart: unless-stopped

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      centrifugo:
        condition: service_started
    # No host port — this project's own nginx (below) reaches it by service name on the
    # internal compose network now, not via a loopback port.
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-divebubble}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-divebubble}?sslmode=disable"
      CENTRIFUGO_URL: "http://centrifugo:8000"
      CENTRIFUGO_API_KEY: "${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY must be set}"
      CENTRIFUGO_TOKEN_SECRET: "${CENTRIFUGO_TOKEN_SECRET:?CENTRIFUGO_TOKEN_SECRET must be set}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      GOOGLE_SERVER_CLIENT_IDS: "${GOOGLE_SERVER_CLIENT_IDS:?GOOGLE_SERVER_CLIENT_IDS must be set}"
      # Optional — defaults to io.divebubble.app in config.go if unset (the only bundle id
      # this project ships). APPLE_TEAM_ID/KEY_ID/PRIVATE_KEY are all optional together too —
      # unset disables Apple token revocation on account deletion only, sign-in still works.
      APPLE_AUDIENCE: "${APPLE_AUDIENCE:-}"
      APPLE_TEAM_ID: "${APPLE_TEAM_ID:-}"
      APPLE_KEY_ID: "${APPLE_KEY_ID:-}"
      APPLE_PRIVATE_KEY: "${APPLE_PRIVATE_KEY:-}"
      # Optional — unset disables push notifications (internal/push.Service no-ops). See
      # .env.example for where this comes from.
      FIREBASE_CREDENTIALS_JSON: "${FIREBASE_CREDENTIALS_JSON:-}"
      # Optional — unset disables real email sending (internal/email.Service logs instead,
      # see its own doc comment). ADMIN_BASE_URL must be the real
      # https://admin.divebubble.io in production or magic links point at localhost.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM_ADDRESS: "${EMAIL_FROM_ADDRESS:-}"
      ADMIN_BASE_URL: "${ADMIN_BASE_URL:-}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-8h}"
      REFRESH_SESSION_TTL: "${REFRESH_SESSION_TTL:-4320h}"
      UPLOAD_DIR: "/data/uploads"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set, e.g. https://api.divebubble.io}"
      # No wildcard default in prod (see config.go) — must be the real app/admin origins,
      # e.g. https://admin.divebubble.io,https://divebubble.io
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in production}"
      # Optional — unset (all blank) means uploads fall back to local disk (UPLOAD_DIR
      # above). See .env.example's own Spaces section and internal/upload/service.go.
      SPACES_ENDPOINT: "${SPACES_ENDPOINT:-}"
      SPACES_REGION: "${SPACES_REGION:-}"
      SPACES_BUCKET: "${SPACES_BUCKET:-}"
      SPACES_ACCESS_KEY: "${SPACES_ACCESS_KEY:-}"
      SPACES_SECRET_KEY: "${SPACES_SECRET_KEY:-}"
      SPACES_CDN_URL: "${SPACES_CDN_URL:-}"
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped

  # No host port — the droplet's shared gateway-nginx (outside this repo, not git-tracked)
  # owns 80/443 and Cloudflare Origin TLS, and reverse-proxies here in plain HTTP over the
  # external gateway_net network (see `networks` block below). `default` is still needed
  # too, since this is how this nginx reaches api/centrifugo by service name.
  nginx:
    image: nginx:1.27-alpine
    # Explicit, stable name — the shared gateway-nginx (a different compose project) refers
    # to this container by name on gateway_net; the default compose-generated name isn't
    # something to rely on for that (and would collide with foreignreader's own same-named
    # `nginx` service on that shared network without this).
    container_name: divebubble-nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - gateway_net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  gateway_net:
    external: true

volumes:
  postgres_data:
  uploads_data:
