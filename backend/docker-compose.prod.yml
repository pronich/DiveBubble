services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-divebubble}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-divebubble}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-divebubble} -d ${POSTGRES_DB:-divebubble}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-divebubble}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-divebubble}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    # Bound to the host loopback only — the shared droplet nginx (not a container on this
    # compose project's own network) reverse-proxies /connection/websocket to this port. See
    # nginx/api.divebubble.io.conf.
    ports:
      - "127.0.0.1:${CENTRIFUGO_PORT:-8090}:8000"
    environment:
      CENTRIFUGO_API_KEY: "${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY must be set}"
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: "${CENTRIFUGO_TOKEN_SECRET:?CENTRIFUGO_TOKEN_SECRET must be set}"
    restart: unless-stopped

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      centrifugo:
        condition: service_started
    # Bound to the host loopback only, same reasoning as centrifugo above — the shared
    # droplet nginx proxies everything else to this port.
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-divebubble}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-divebubble}?sslmode=disable"
      CENTRIFUGO_URL: "http://centrifugo:8000"
      CENTRIFUGO_API_KEY: "${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY must be set}"
      CENTRIFUGO_TOKEN_SECRET: "${CENTRIFUGO_TOKEN_SECRET:?CENTRIFUGO_TOKEN_SECRET must be set}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      GOOGLE_SERVER_CLIENT_ID: "${GOOGLE_SERVER_CLIENT_ID:?GOOGLE_SERVER_CLIENT_ID must be set}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-8h}"
      REFRESH_SESSION_TTL: "${REFRESH_SESSION_TTL:-4320h}"
      UPLOAD_DIR: "/data/uploads"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set, e.g. https://api.divebubble.io}"
      # No wildcard default in prod (see config.go) — must be the real app/admin origins,
      # e.g. https://admin.divebubble.io,https://divebubble.io
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in production}"
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
