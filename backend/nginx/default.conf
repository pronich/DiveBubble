# TLS terminates at the droplet's shared gateway-nginx (outside this repo, not git-tracked —
# it owns 80/443 and holds the Cloudflare Origin certs for every project on the droplet).
# This nginx only receives already-decrypted plain HTTP from the gateway, so no
# ssl_certificate/redirect block lives here — see docker-compose.prod.yml's nginx service.
server {
    listen 80;
    server_name api.divebubble.io;

    # nginx's own default (1MB) sits below internal/upload.Service's 5MB cap — anything
    # between the two got rejected here with a 413 before the Go app ever saw the request
    # (and had a chance to give a real "too large" error naming the actual limit).
    client_max_body_size 6m;

    # A bare `proxy_pass http://centrifugo:8000` (or `http://api:8080`) resolves that
    # hostname ONCE, at worker startup, and caches the IP forever — if the upstream
    # container gets recreated with a new IP (a sibling service's own redeploy touching the
    # shared network is enough to trigger this, not just this container's own restart) nginx
    # keeps sending traffic to the dead address until nginx itself is restarted, silently
    # 502ing everything in between. 127.0.0.11 is Docker's embedded DNS server; putting the
    # upstream in a variable forces nginx through the `resolver` on every request (bounded
    # by `valid`) instead of caching indefinitely — this incident (Centrifugo's IP moved,
    # nginx kept dialing the old one, WebSocket handshakes 502'd for hours) is exactly what
    # this fixes, without depending on remembering to restart nginx on every deploy.
    resolver 127.0.0.11 valid=10s;

    # Centrifugo's WebSocket endpoint — app/'s and admin/'s RealtimeService connect to
    # wss://api.divebubble.io/connection/websocket in production.
    location /connection/websocket {
        set $centrifugo_upstream centrifugo:8000;
        proxy_pass http://$centrifugo_upstream/connection/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location / {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
