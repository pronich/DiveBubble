# Not loaded by this project's own docker-compose.prod.yml — DiveBubble runs no nginx
# container of its own on this droplet, since foreignreader_be's nginx already owns 80/443
# there. Drop this file into that nginx's conf.d/ (or wherever its other server blocks
# live) instead, alongside its existing api.foreignreader.io block.
#
# Assumes docker-compose.prod.yml's default ports: API_PORT=8081, CENTRIFUGO_PORT=8090 —
# both bound to 127.0.0.1 on this same droplet, so the shared nginx reaches them over
# loopback rather than a shared Docker network.
#
# TLS: get a cert for api.divebubble.io the same way api.foreignreader.io's was obtained
# (e.g. certbot) — not something this file can do for you.

server {
    listen 80;
    server_name api.divebubble.io;
    return 301 https://api.divebubble.io$request_uri;
}

server {
    listen 443 ssl;
    server_name api.divebubble.io;

    ssl_certificate /etc/nginx/ssl/api.divebubble.io/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/api.divebubble.io/key.pem;

    # Centrifugo's WebSocket endpoint — app/'s and admin/'s RealtimeService connect to
    # wss://api.divebubble.io/connection/websocket in production (see main.dart's
    # _centrifugoWsUrl, currently hardcoded to localhost for dev).
    location /connection/websocket {
        proxy_pass http://127.0.0.1:8090/connection/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
