# Config for `flutter gen-l10n` (run automatically by `flutter run`/`flutter build` once
# pubspec.yaml's flutter.generate is true — no separate build_runner step needed for this).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
